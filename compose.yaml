# Local development database.
#
# Bring it up with:
#   podman compose up -d      # or: docker compose up -d
#
# Then point DATABASE_URL at it (see .env.example):
#   postgres://postgres:postgres@127.0.0.1:55432/ferristak
services:
  db:
    image: postgis/postgis:16-3.5
    container_name: ferristak-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ferristak
    ports:
      - "55432:5432"
    volumes:
      - ferristak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ferristak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ferristak-db-data:
