# fly.toml app configuration file generated for ferristak on 2026-10-21T17:05:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ferristak'
primary_region = 'ord'

[build]

[deploy]
  release_command = 'ferristak migrate'

[env]
  BIND_ADDR = '0.0.0.0:8080'
  RUN_MIGRATIONS = 'false'
  RUST_LOG = 'info,ferristak=info,tower_http=info'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
