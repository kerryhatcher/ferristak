# fly.toml — Fly.io deployment for ferristak.
# Docs: https://fly.io/docs/reference/configuration/
#
# Secrets (set once, never commit):
#   fly secrets set DATABASE_URL='postgresql://...' JWT_SECRET="$(openssl rand -base64 48)"
app = "ferristak"
primary_region = "ord"

[build]

[env]
  BIND_ADDR = "0.0.0.0:8080"
  # Migrations are executed by the release_command below, so don't run them
  # on every machine boot.
  RUN_MIGRATIONS = "false"
  RUST_LOG = "info,ferristak=info,tower_http=info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[deploy]
  # Runs once per deploy, before any machine is updated. Has access to secrets.
  # The image ENTRYPOINT is already `/usr/local/bin/ferristak`, and Fly does not
  # override it, so the command must be just the subcommand. `ferristak migrate`
  # here would run as `ferristak ferristak migrate` and fail.
  release_command = "migrate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
